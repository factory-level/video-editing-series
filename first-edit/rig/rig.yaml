version: "0.2"
name: first-edit
summary: >
  Turns an uploaded take into the raw timeline. The cutter syncs camera and studio sound and cuts the
  take into scenes, each holding its clips (candidates); the assembler puts the best clip of each
  scene on the HyperFrames timeline. One queue item is one take. See first-edit/README.md.

pods:
  - id: edit
    label: First edit
    members:
      - id: cut
        label: Cutter
        agent_ref: "local:agents/cutter"
        runtime: claude-code
        profile: default
        cwd: "../.."
      - id: assemble
        label: Assembler
        agent_ref: "local:agents/assembler"
        runtime: claude-code
        profile: default
        cwd: "../.."
    edges:
      - kind: delegates_to
        from: cut
        to: assemble

edges: []
