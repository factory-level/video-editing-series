version: "0.2"
name: first-edit
summary: >
  Turns an uploaded take into the raw timeline. The cutter aligns camera and studio sound, cuts every
  reading into its own piece and sorts the pieces by idea; the assembler puts the suggested reading of
  each idea on the HyperFrames timeline. One queue item is one take. See first-edit/README.md.

pods:
  - id: edit
    label: First edit
    members:
      - id: cut
        label: Cutter
        agent_ref: "local:agents/cutter"
        runtime: claude-code
        profile: default
        cwd: "../.."
      - id: assemble
        label: Assembler
        agent_ref: "local:agents/assembler"
        runtime: claude-code
        profile: default
        cwd: "../.."
    edges:
      - kind: delegates_to
        from: cut
        to: assemble

edges: []
