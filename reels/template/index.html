<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* A vertical reel, 1080x1920 (9:16). The reel editor replaces these placeholders with the prompt's look. */
      :root {
        --ground: #000;
        --ink: #ffffff;
        --font-display: sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font-display); }
      #root > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #placeholder {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: var(--ink); font-size: 64px; font-weight: 600; text-align: center; padding: 0 80px;
      }
    </style>
  </head>
  <body>
    <!-- A reel made from Drive footage with a prompt (reels/README.md). The footage is linked at assets/raw/;
         the prompt is assets/raw/prompt.md. The reel editor builds the cut here; the placeholder goes. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="placeholder" class="clip" data-start="0" data-duration="3" data-track-index="0">Reel not edited yet</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
